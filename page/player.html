<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../scripts/music.js"></script>

    <style>
        #fire {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .lyrics-wrapper {
            position: relative;
            z-index: 10;
        }

        .music-info {
            position: relative;
            z-index: 10;
        }

        #img-music {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-black text-neutral-100 min-h-screen flex flex-col items-center justify-center overflow-hidden antialiased select-none px-6">

    <header class="music-info absolute top-10 left-4 flex gap-4 items-end justify-start">
        <img
            src=""
            id="img-music"
            class=""
            alt="Cover"
        >

        <h1
            id="title-music"
            class="text-xl md:text-2xl text-center font-medium tracking-tight max-w-2xl italic"
        ></h1>

    </header>

    <canvas id="fire"></canvas>

    <div class="absolute top-0 left-0 w-full p-6 flex justify-end z-30">

        <button
            onclick="history.back()"
            class="flex items-center space-x-2 text-xs uppercase tracking-widest text-neutral-400 hover:text-white transition-colors duration-300 focus:outline-none bg-neutral-900/50 border border-neutral-800/80 px-4 py-2 rounded-full backdrop-blur-sm cursor-pointer"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="w-3 h-3"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
                />
            </svg>
        </button>

    </div>

    <div class="lyrics-wrapper w-full max-w-4xl flex flex-col items-center justify-center">

        <audio
            id="audio-player"
            class="hidden"
        ></audio>

        <div
            id="lyrics-container"
            class="text-4xl md:text-6xl tracking-tight text-center max-w-3xl leading-tight transition-all mb-12"
        >
            ...
        </div>

    </div>

</body>

</html>
