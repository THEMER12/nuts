<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="scripts/music.js"></script>
  <title>Reproductor Lil Peep</title>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">

  <main class="flex flex-col items-center gap-6 p-4">
    <div id="player-container" class="flex flex-col items-center gap-4 transition-all duration-500 ease-in-out">
      <div class="relative group w-64 h-64">
        <img src="img/nuts.png" alt="Portada del álbum" 
             class="w-full h-full object-cover cursor-pointer transition duration-300 group-hover:brightness-75">

        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300">
          <svg id="cover-svg" width="80px" height="80px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.715 6.36694L16.4 10.6639C16.7719 10.9289 16.9927 11.3573 16.9927 11.8139C16.9927 12.2706 16.7719 12.699 16.4 12.9639L10.71 17.6639C10.2297 18.0453 9.5794 18.1339 9.01458 17.8948C8.44975 17.6558 8.06062 17.1273 8.00003 16.5169V7.51694C8.05845 6.90422 8.44802 6.37281 9.01478 6.13275C9.58154 5.89269 10.2343 5.9826 10.715 6.36694Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <h1 class="text-white text-xl font-semibold mt-2">Lil Peep - Live Forever</h1>
    </div>

    <audio id="music" src="music/Lil Peep_LIVE FOREVER_04_Nuts.flac"></audio>
    <div id="lyrics" class="text-xl text-white"></div>
  </main>


</body>
</html>
